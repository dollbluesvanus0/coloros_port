[workspace]
resolver = "2"
members = [
    "crates/coloros-common",
    "crates/rom-fs-patcher",
    "crates/dex-patcher",
    "crates/smali-patcher",
    "crates/prop-tool",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["coloros_port contributors"]
license = "GPL-3.0"

[workspace.dependencies]
anyhow = "1.0"
thiserror = "1.0"
clap = { version = "4.5", features = ["derive"] }
rayon = "1.10"
regex = "1.10"
walkdir = "2.5"
jwalk = "0.8"
memmap2 = "0.9"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
sha1 = "0.10"
adler2 = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.12"
coloros-common = { path = "crates/coloros-common" }
rom-fs-patcher = { path = "crates/rom-fs-patcher" }
dex-patcher = { path = "crates/dex-patcher" }
smali-patcher = { path = "crates/smali-patcher" }
prop-tool = { path = "crates/prop-tool" }

[package]
name = "coloros-tools"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Unified CLI toolset for ColorOS/OxygenOS ROM porting"

[[bin]]
name = "coloros-tools"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
coloros-common.workspace = true
rom-fs-patcher.workspace = true
dex-patcher.workspace = true
smali-patcher.workspace = true
prop-tool.workspace = true

[dev-dependencies]
tempfile.workspace = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

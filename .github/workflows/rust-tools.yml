name: Build Rust Tools

on:
  push:
    paths:
      - 'tools-rust/**'
      - '.github/workflows/rust-tools.yml'
  pull_request:
    paths:
      - 'tools-rust/**'
      - '.github/workflows/rust-tools.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Cargo Test
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: tools-rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools-rust
      - name: Run workspace unit & integration tests
        run: cargo test --workspace

  build-linux:
    name: Build Static Linux (${{ matrix.target }})
    needs: test
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            dest_dir: bin/Linux/x86_64
          - target: aarch64-unknown-linux-musl
            dest_dir: bin/Linux/aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools-rust
          key: ${{ matrix.target }}
      - name: Install musl cross-compilation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools gcc-aarch64-linux-gnu
      - name: Build static release binaries
        working-directory: tools-rust
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: aarch64-linux-gnu-gcc
        run: |
          cargo build --release --workspace --target ${{ matrix.target }}
      - name: Stage binaries into ${{ matrix.dest_dir }}
        run: |
          mkdir -p "${{ matrix.dest_dir }}"
          cp -f "tools-rust/target/${{ matrix.target }}/release/coloros-tools" "${{ matrix.dest_dir }}/"
          for tool in rom-fs-patcher dex-patcher smali-patcher prop-tool; do
            ln -sf coloros-tools "${{ matrix.dest_dir }}/${tool}"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: coloros-tools-${{ matrix.target }}
          path: |
            tools-rust/target/${{ matrix.target }}/release/coloros-tools
            tools-rust/target/${{ matrix.target }}/release/rom-fs-patcher
            tools-rust/target/${{ matrix.target }}/release/dex-patcher
            tools-rust/target/${{ matrix.target }}/release/smali-patcher
            tools-rust/target/${{ matrix.target }}/release/prop-tool

  build-macos:
    name: Build macOS (${{ matrix.target }})
    needs: test
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            dest_dir: bin/Darwin/X86_64
          - target: aarch64-apple-darwin
            dest_dir: bin/Darwin/aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools-rust
          key: ${{ matrix.target }}
      - name: Build release binaries
        working-directory: tools-rust
        run: |
          cargo build --release --workspace --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: coloros-tools-${{ matrix.target }}
          path: |
            tools-rust/target/${{ matrix.target }}/release/coloros-tools
            tools-rust/target/${{ matrix.target }}/release/rom-fs-patcher
            tools-rust/target/${{ matrix.target }}/release/dex-patcher
            tools-rust/target/${{ matrix.target }}/release/smali-patcher
            tools-rust/target/${{ matrix.target }}/release/prop-tool

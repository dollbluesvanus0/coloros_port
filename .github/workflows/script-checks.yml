name: Check Port Scripts

on:
  push:
    paths:
      - 'port.sh'
      - 'functions.sh'
      - 'setup.sh'
      - 'bin/**'
      - 'tests/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'port.sh'
      - 'functions.sh'
      - 'setup.sh'
      - 'bin/**'
      - 'tests/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Python test dependencies
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            python3-requests python3-tqdm
      - name: Check shell syntax
        run: |
          for script in port.sh functions.sh setup.sh bin/port_performance.sh bin/systemui_color_compat.sh bin/getSuperSize.sh; do
            bash -n "$script"
          done
      - name: Run full Python unit test suite
        run: |
          python3 -m unittest discover -s tests -v

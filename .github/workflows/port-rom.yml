name: Port ROM

on:
  workflow_dispatch:
    inputs:
      base_rom_url:
        description: Direct HTTPS URL or device name/code (e.g. rmx3301/rmx3301) for base ROM
        required: true
        type: string
      port_rom_url:
        description: Direct HTTPS URL or device name/code (e.g. Oneplus 13) for donor ROM
        required: true
        type: string
      second_port_rom_url:
        description: Optional second donor ROM direct URL or device name (requires port_parts)
        required: false
        type: string
      port_parts:
        description: Partitions to take from the second donor, comma-separated
        required: false
        type: string
      runner:
        description: Self-hosted requires a disposable Linux x64 runner with sudo
        type: choice
        default: ubuntu-24.04
        options:
          - ubuntu-24.04
          - self-hosted
      pack_method:
        description: Package format to build (ota for recovery payload.bin, fastboot for fastboot flashing scripts)
        type: choice
        default: ota
        options:
          - ota
          - fastboot

permissions:
  contents: read

jobs:
  port:
    runs-on: ${{ inputs.runner == 'self-hosted' && fromJSON('["self-hosted", "Linux", "X64"]') || inputs.runner }}
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Check Pixeldrain configuration
        env:
          PIXELDRAIN_API_KEY: ${{ secrets.PIXELDRAIN_API_KEY }}
        run: |
          if [[ -z "$PIXELDRAIN_API_KEY" ]]; then
            echo '::error::Add PIXELDRAIN_API_KEY in repository Settings > Secrets and variables > Actions.'
            exit 1
          fi

      - name: Validate runner and inputs
        env:
          BASE_INPUT: ${{ inputs.base_rom_url }}
          PORT_INPUT: ${{ inputs.port_rom_url }}
          SECOND_PORT_INPUT: ${{ inputs.second_port_rom_url }}
          PORT_PARTS: ${{ inputs.port_parts }}
          PACK_METHOD_INPUT: ${{ inputs.pack_method }}
        run: |
          python3 - <<'PY'
          import os, re
          base_input = os.environ['BASE_INPUT'].strip()
          port_input = os.environ['PORT_INPUT'].strip()
          if not base_input or not port_input:
              raise SystemExit('base_rom_url and port_rom_url must not be empty')
          second_input = os.environ['SECOND_PORT_INPUT'].strip()
          parts = os.environ['PORT_PARTS'].strip()
          if bool(second_input) != bool(parts):
              raise SystemExit('Second donor URL and port_parts must be provided together')
          if parts and not re.fullmatch(r'[A-Za-z0-9_]+(?:,[A-Za-z0-9_]+)*', parts):
              raise SystemExit('port_parts must be comma-separated partition names')
          pack_method = os.environ.get('PACK_METHOD_INPUT', 'ota').strip().lower()
          if pack_method not in ('ota', 'fastboot'):
              raise SystemExit('pack_method must be ota or fastboot')
          PY
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          df -h .
          available_kb=$(df -Pk . | awk 'NR==2 {print $4}')
          if (( available_kb < 30 * 1024 * 1024 )); then
            echo '::error::At least 30 GiB free space is required; large ROMs may require substantially more. Use a larger runner.'
            exit 1
          fi

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            aria2 python3 busybox zip unzip p7zip-full openjdk-21-jre-headless \
            zstd bc android-sdk-libsparse-utils xmlstarlet dos2unix python3-requests python3-tqdm python3-pip
          python3 -m pip install playwright --break-system-packages || python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium
          echo 'JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64' >> "$GITHUB_ENV"
          echo '/usr/lib/jvm/java-21-openjdk-amd64/bin' >> "$GITHUB_PATH"
          bash -n port.sh functions.sh
          java -version
          printf '%s  %s\n' dbf930b076c6b9be08d57c449cacefc3bdd6b71ebd59b3066fc0e1f5b14f9423 bin/apktool/apktool.jar | sha256sum -c -
          java -jar bin/apktool/apktool.jar --version
          python3 -m unittest discover -s tests -v
          python3 tests/smoke_wallpapers_patch.py
          python3 tests/smoke_cos17_engineer.py
          python3 tests/smoke_apktool_resources.py
          python3 tests/test_fetch_rom_url.py

      - name: Resolve ROM URLs
        env:
          BASE_INPUT: ${{ inputs.base_rom_url }}
          PORT_INPUT: ${{ inputs.port_rom_url }}
          SECOND_PORT_INPUT: ${{ inputs.second_port_rom_url }}
        run: |
          set -euo pipefail
          echo "Resolving base ROM..."
          RESOLVED_BASE_URL=$(python3 bin/fetch_rom_url.py "$BASE_INPUT")
          echo "Resolving port ROM..."
          RESOLVED_PORT_URL=$(python3 bin/fetch_rom_url.py "$PORT_INPUT")
          echo "BASE_ROM_URL=${RESOLVED_BASE_URL}" >> "$GITHUB_ENV"
          echo "PORT_ROM_URL=${RESOLVED_PORT_URL}" >> "$GITHUB_ENV"
          if [[ -n "${SECOND_PORT_INPUT:-}" ]]; then
            echo "Resolving second port ROM..."
            RESOLVED_SECOND_PORT_URL=$(python3 bin/fetch_rom_url.py "$SECOND_PORT_INPUT")
            echo "SECOND_PORT_ROM_URL=${RESOLVED_SECOND_PORT_URL}" >> "$GITHUB_ENV"
          fi

      - name: Download ROMs
        timeout-minutes: 90
        env:
          BASE_ROM_URL: ${{ env.BASE_ROM_URL }}
          PORT_ROM_URL: ${{ env.PORT_ROM_URL }}
          SECOND_PORT_ROM_URL: ${{ env.SECOND_PORT_ROM_URL }}
          PORT_PARTS: ${{ inputs.port_parts }}
        run: |
          set -euo pipefail
          mkdir -p build/ci-inputs
          source functions.sh
          validate_zip() {
            local status=0
            unzip -tq "$1" || status=$?
            (( status == 0 || status == 1 ))
          }
          download() {
            port_download_rom "$1" "$2" || return $?
            test -s "$2"
            validate_zip "$2"
          }
          touch build/download-base.log build/download-port.log
          tail -n +1 -F build/download-base.log build/download-port.log &
          monitor_pid=$!
          trap 'kill "$monitor_pid" 2>/dev/null || true' EXIT
          # At most two ROMs concurrently (four connections per ROM).
          download "$BASE_ROM_URL" "$PWD/build/ci-inputs/base.zip" > build/download-base.log 2>&1 &
          base_pid=$!
          download "$PORT_ROM_URL" "$PWD/build/ci-inputs/port.zip" > build/download-port.log 2>&1 &
          port_pid=$!
          failed=0
          wait "$base_pid" || failed=1
          wait "$port_pid" || failed=1
          if (( failed )); then
            tail -n 30 build/download-base.log build/download-port.log
            exit 1
          fi
          if [[ -n "${SECOND_PORT_ROM_URL:-}" ]]; then
            download "$SECOND_PORT_ROM_URL" "$PWD/build/ci-inputs/second.zip"
          fi

      - name: Port ROM
        timeout-minutes: 240
        env:
          PORT_LOW_DISK: 'true'
          PACK_METHOD: ${{ inputs.pack_method }}
          SECOND_PORT_ROM_URL: ${{ env.SECOND_PORT_ROM_URL }}
          PORT_PARTS: ${{ inputs.port_parts }}
        run: |
          set -euo pipefail
          args=("$PWD/build/ci-inputs/base.zip" "$PWD/build/ci-inputs/port.zip")
          if [[ -n "${SECOND_PORT_ROM_URL:-}" ]]; then
            args+=("$PWD/build/ci-inputs/second.zip" "${PORT_PARTS//,/ }")
          fi
          bash port.sh "${args[@]}" 2>&1 | tee build/ci-port.log

      - name: Collect completed packages
        run: |
          set -euo pipefail
          mkdir -p build/ci-uploads
          validate_zip() {
            local status=0
            unzip -tq "$1" || status=$?
            (( status == 0 || status == 1 ))
          }
          while IFS= read -r -d '' package; do
            validate_zip "$package"
            ln -- "$package" build/ci-uploads/
          done < <(find out -maxdepth 2 -type f -name '*.zip' -print0)
          shopt -s nullglob
          packages=(build/ci-uploads/*.zip)
          if (( ${#packages[@]} == 0 )); then
            echo '::error::port.sh did not produce a ROM ZIP'
            exit 1
          fi
          cd build/ci-uploads
          sha256sum -- *.zip > SHA256SUMS

      - name: Upload firmware to Pixeldrain
        timeout-minutes: 60
        env:
          PIXELDRAIN_API_KEY: ${{ secrets.PIXELDRAIN_API_KEY }}
        run: |
          python3 bin/upload_pixeldrain.py build/ci-uploads/*.zip build/ci-uploads/SHA256SUMS

      - name: Show failure logs
        if: failure()
        run: |
          for log in build/ci-port.log build/port.log build/download-*.log; do
            if [[ -f "$log" ]]; then
              echo "Log: $log"
              tail -n 80 -- "$log"
            fi
          done
